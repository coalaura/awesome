<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="dark">
		<title>awesome feeds</title>
		<link rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%231d2021'/><circle cx='4.5' cy='11.5' r='1.5' fill='%23fe8019'/><path d='M3 7.5a5.5 5.5 0 0 1 5.5 5.5M3 4a9 9 0 0 1 9 9' stroke='%23fe8019' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>">
		<style>
			:root {
				--bg: #1d2021;
				--panel: #282828;
				--border: #3c3836;
				--border-hi: #504945;
				--fg: #ebdbb2;
				--dim: #928374;
				--faint: #665c54;
				--yellow: #fabd2f;
				--green: #b8bb26;
				--blue: #83a598;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 5rem 1.5rem 3rem;
				background: var(--bg);
				color: var(--fg);
				font: 15px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				-webkit-font-smoothing: antialiased;
			}

			main {
				max-width: 42rem;
				margin: 0 auto;
			}

			h1 {
				margin: 0 0 .35rem;
				font-size: 1.6rem;
				letter-spacing: -.02em;
			}

			h1 span {
				color: var(--yellow);
			}

			header p {
				margin: 0;
				color: var(--dim);
			}

			ul {
				list-style: none;
				margin: 2.75rem 0 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: .75rem;
			}

			li {
				display: flex;
				align-items: center;
				justify-content: space-between;
				flex-wrap: wrap;
				gap: .75rem 1rem;
				padding: .85rem 1.1rem;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 4px;
				transition: border-color .12s ease;
			}

			li:hover {
				border-color: var(--border-hi);
			}

			.name {
				color: var(--fg);
				font-weight: 700;
				text-decoration: none;
			}

			.name::before {
				content: "#";
				margin-right: .3rem;
				color: var(--green);
			}

			.name:hover {
				color: var(--yellow);
			}

			.repo {
				display: block;
				font-size: .78rem;
				color: var(--dim);
				text-decoration: none;
			}

			.repo:hover {
				color: var(--blue);
			}

			.formats {
				display: flex;
				gap: .4rem;
			}

			.formats a {
				padding: .15rem .6rem;
				font-size: .76rem;
				color: var(--dim);
				text-decoration: none;
				border: 1px solid var(--border);
				border-radius: 3px;
				transition: all .12s ease;
			}

			.formats a:hover {
				color: var(--bg);
				background: var(--yellow);
				border-color: var(--yellow);
			}

			.empty {
				padding: .85rem 1.1rem;
				color: var(--dim);
				border: 1px dashed var(--border);
				border-radius: 4px;
			}

			footer {
				margin-top: 2.75rem;
				font-size: .76rem;
				color: var(--faint);
				text-align: center;
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<h1>awesome<span>feeds</span></h1>
				<p>rss, atom and json feeds for links added to awesome lists.</p>
			</header>

			<ul>
				{{range .Feeds}}
				<li>
					<div>
						<a class="name" href="/{{.Type}}">{{.Type}}</a>
						<a class="repo" href="https://github.com/{{.Repository}}">{{.Repository}}@{{.Branch}}</a>
					</div>
					<div class="formats">
						<a href="/{{.Type}}/rss">rss</a>
						<a href="/{{.Type}}/atom">atom</a>
						<a href="/{{.Type}}/json">json</a>
					</div>
				</li>
				{{else}}
					<li class="empty">no feeds configured</li>
					{{end}}
			</ul>

			<footer>refreshed every {{.Interval}}</footer>
		</main>
	</body>
</html>
